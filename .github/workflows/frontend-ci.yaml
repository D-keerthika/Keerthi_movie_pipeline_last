name: Frontend Continuous Integration

on:
  pull_request:
    paths:
      - 'starter/frontend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend Source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Fetch repository code
        uses: actions/checkout@v4

      - name: Initialize Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Install dependencies via clean install
        run: npm ci

      - name: Execute linter checks
        run: npm run lint

  test:
    name: Run Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Fetch repository code
        uses: actions/checkout@v4

      - name: Initialize Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Install dependencies via clean install
        run: npm ci

      - name: Execute frontend test suites
        env:
          CI: "true"
        run: npm test

  build:
    name: Verify Frontend Container Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Fetch repository code
        uses: actions/checkout@v4

      - name: Build frontend container image
        env:
          REACT_APP_MOVIE_API_URL: "http://localhost:5000"
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ env.REACT_APP_MOVIE_API_URL }}" \
            -t mp-frontend:local-test .