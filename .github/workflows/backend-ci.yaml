name: Backend Continuous Integration

on:
  pull_request:
    paths:
      - 'starter/backend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend Source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Fetch repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv tool
        run: pip install pipenv

      - name: Cache Pipenv environment
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install backend dependencies
        run: pipenv install --dev

      - name: Execute flake8 / linter
        run: pipenv run lint

  test:
    name: Run Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Fetch repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv tool
        run: pip install pipenv

      - name: Cache Pipenv environment
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install backend dependencies
        run: pipenv install --dev

      - name: Execute pytest suite
        run: pipenv run test

  build:
    name: Verify Backend Container Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Fetch repository code
        uses: actions/checkout@v4

      - name: Build backend container image
        run: docker build -t mp-backend:local-test .