name: Frontend Continuous Deployment

on:
  push:
    paths:
      - 'starter/frontend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend Source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint

  test:
    name: Run Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - env:
          CI: "true"
        run: npm test

  deploy:
    name: Release Frontend to EKS
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup AWS Session Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Frontend Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: frontend
          TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: "http://localhost:5000"
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ env.REACT_APP_MOVIE_API_URL }}" \
            -t $REGISTRY/$REPO_NAME:$TAG .
          docker push $REGISTRY/$REPO_NAME:$TAG

      - name: Configure EKS Cluster Context
        run: aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Deploy Frontend Manifests via Kustomize
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: frontend
          TAG: ${{ github.sha }}
        run: |
          cd k8s
          kustomize edit set image frontend=$REGISTRY/$REPO_NAME:$TAG
          kustomize build | kubectl apply -f -
          